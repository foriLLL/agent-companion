# 一键升级脚本的端到端验证：在干净的 macOS 上装出老用户的安装，再执行发给用户的原命令（raw main 上的脚本）。
name: Upgrade script check

on:
  push:
    branches: [ci/upgrade-script-check]
  workflow_dispatch:

permissions:
  contents: read

env:
  UPGRADE: curl -fsSL https://raw.githubusercontent.com/foriLLL/codex_companion/main/scripts/upgrade.sh | bash
  OLD_HEAD: de62245478c4a66c7e88a9c6a17c01edea817bf2   # 0.2.0 之前：Formula 只有 head，代码里还没有自动更新
  GH_TOKEN: ${{ github.token }}

jobs:
  homebrew-head:
    name: 老用户 brew --HEAD 安装（0.1.3）
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: 装出老用户的状态
        run: |
          set -x
          brew --version
          brew tap foriLLL/codex-companion https://github.com/foriLLL/codex_companion
          TAP=$(brew --repository foriLLL/codex-companion)
          git -C "$TAP" reset -q --hard "$OLD_HEAD"
          # 让 --HEAD 构建老提交的代码；装完把 tap 恢复成当时的样子
          sed -i '' "s/branch: \"main\"/revision: \"$OLD_HEAD\"/" "$TAP/Formula/codex-companion.rb"
          brew trust --formula foriLLL/codex-companion/codex-companion || true
          HOMEBREW_NO_AUTO_UPDATE=1 brew install --HEAD codex-companion
          git -C "$TAP" checkout -q -- Formula/codex-companion.rb
          codex-companion agent install
          brew list --versions codex-companion
          plutil -extract ProgramArguments json -o - ~/Library/LaunchAgents/com.codexcompanion.agent.plist
      - name: 执行发给用户的一键升级命令
        run: eval "$UPGRADE"
      - name: 检查：换成最新正式版，后台服务指向 Homebrew 并以新版本运行
        run: |
          set -x
          latest=$(gh release view --repo foriLLL/codex_companion --json tagName --jq .tagName); latest=${latest#v}
          test "$(brew list --versions codex-companion)" = "codex-companion $latest"
          test "$(plutil -extract ProgramArguments.0 raw -o - ~/Library/LaunchAgents/com.codexcompanion.agent.plist)" = "$(brew --prefix)/opt/codex-companion/bin/codex-companion"
          for _ in $(seq 30); do
            status=$(codex-companion agent status 2>/dev/null || true); echo "$status"
            echo "$status" | jq -e --arg v "$latest" '.available == true and .version == $v' >/dev/null && exit 0
            sleep 2
          done
          exit 1
      - name: 失败时的日志
        if: failure()
        run: tail -n 80 ~/Library/Logs/codex-companion/* || true

  homebrew-stable:
    name: brew 正式版 0.2.0，未注册后台服务
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: 装出 0.2.0
        run: |
          set -x
          brew tap foriLLL/codex-companion https://github.com/foriLLL/codex_companion
          TAP=$(brew --repository foriLLL/codex-companion)
          git -C "$TAP" reset -q --hard "$(git -C "$TAP" log --format=%H -1 --grep '^chore: Formula 更新到 v0.2.0$')"
          brew trust --formula foriLLL/codex-companion/codex-companion || true
          HOMEBREW_NO_AUTO_UPDATE=1 brew install codex-companion
          brew list --versions codex-companion
      - name: 执行发给用户的一键升级命令
        run: eval "$UPGRADE" | tee upgrade.log
      - name: 检查：升到最新正式版，提示自行注册后台服务
        run: |
          set -x
          latest=$(gh release view --repo foriLLL/codex_companion --json tagName --jq .tagName); latest=${latest#v}
          test "$(brew list --versions codex-companion)" = "codex-companion $latest"
          grep -q "codex-companion agent install" upgrade.log
          test ! -e ~/Library/LaunchAgents/com.codexcompanion.agent.plist

  source:
    name: 源码安装（0.1.3 的提交）
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      CODEX_COMPANION_SKIP_FFMPEG: "1"
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 装出老的源码安装
        run: |
          set -x
          git clone -q https://github.com/foriLLL/codex_companion.git "$HOME/codex_companion"
          cd "$HOME/codex_companion"
          git reset -q --hard "$OLD_HEAD"
          npm ci --no-audit --no-fund
          npm start
          plutil -extract ProgramArguments json -o - ~/Library/LaunchAgents/com.codexcompanion.agent.plist
      - name: 执行发给用户的一键升级命令
        run: eval "$UPGRADE"
      - name: 检查：仓库快进到 main，后台服务以新版本运行
        run: |
          set -x
          cd "$HOME/codex_companion"
          git fetch -q origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          latest=$(node -p 'require("./package.json").version')
          for _ in $(seq 30); do
            status=$(node src/cli.mjs agent status 2>/dev/null || true); echo "$status"
            echo "$status" | jq -e --arg v "$latest" '.available == true and .version == $v' >/dev/null && exit 0
            sleep 2
          done
          exit 1
      - name: 失败时的日志
        if: failure()
        run: tail -n 80 ~/Library/Logs/codex-companion/* || true
