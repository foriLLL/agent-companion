name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 每个 vX.Y.Z tag 都发布：Release 说明取自 CHANGELOG，附源码包；先建草稿，Formula 指向新源码包并推到 main 后
  # 再公开。已安装的 Companion 只看已公开的最新 Release，所以检测到新版本时 Homebrew 已能升级。
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Ensure system FFmpeg for integration tests
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      # 源码 Release 与 Formula 推送之前先跑一遍测试，失败就不发布。
      - name: Run tests
        run: npm test

      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          test "${GITHUB_REF_NAME#v}" = "$PACKAGE_VERSION" || {
            echo "tag $GITHUB_REF_NAME 与 package.json $PACKAGE_VERSION 不一致" >&2
            exit 1
          }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "tag $GITHUB_REF_NAME 不在 main 上" >&2
            exit 1
          }

      - name: Package source and notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET="agent-companion-$VERSION.tar.gz"
          mkdir -p dist
          node scripts/release-ci.mjs notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          git archive --format=tar.gz --prefix="agent-companion-$VERSION/" -o "dist/$ASSET" "$GITHUB_SHA"
          (cd dist && sha256sum "$ASSET" > "$ASSET.sha256")
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          echo "SHA256=$(cut -d' ' -f1 "dist/$ASSET.sha256")" >> "$GITHUB_ENV"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "dist/$ASSET" "dist/$ASSET.sha256" --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" "dist/$ASSET" "dist/$ASSET.sha256" --draft --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: Point Homebrew formula at this release
        run: |
          git fetch origin main
          git switch -C formula-update origin/main
          node scripts/release-ci.mjs formula "${GITHUB_REF_NAME#v}" "$SHA256"
          if git diff --quiet -- Formula/agent-companion.rb; then exit 0; fi
          git add Formula/agent-companion.rb
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: Formula 更新到 $GITHUB_REF_NAME"
          git push origin HEAD:main

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest

  # 签名的 .app 与 Linux 单文件后端：手动运行时总是构建；tag 只在仓库变量 BINARY_RELEASE=true（已配好签名
  # secrets）时一起发布，否则跳过，不影响上面的源码 Release。
  build:
    name: Build ${{ matrix.target }}
    needs: [release]
    if: ${{ always() && (needs.release.result == 'success' || needs.release.result == 'skipped') && (!startsWith(github.ref, 'refs/tags/') || vars.BINARY_RELEASE == 'true') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-26
            asset: agent-companion-darwin-arm64.tar.gz
          - target: darwin-x64
            runner: macos-26-intel
            asset: agent-companion-darwin-x64.tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          test "${GITHUB_REF_NAME#v}" = "$PACKAGE_VERSION" || {
            echo "tag $GITHUB_REF_NAME 与 package.json $PACKAGE_VERSION 不一致" >&2
            exit 1
          }

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Run tests
        run: npm test

      - name: Build app bundle
        run: node scripts/build-app.mjs --target ${{ matrix.target }} --out dist

      - name: Require release signing secrets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            test -n "${!name}" || {
              echo "缺少 release secret: $name；拒绝发布未签名或未公证的应用。" >&2
              exit 1
            }
          done
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || {
            echo "APPLE_TEAM_ID 格式错误；必须是 10 位大写字母或数字。" >&2
            exit 1
          }

      - name: Import Developer ID certificate
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/agent-companion.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/agent-companion.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$CERTIFICATE_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Sign, notarize and staple
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          APP="dist/Agent Companion.app"
          NOTARY_ARCHIVE="$RUNNER_TEMP/agent-companion-notary.zip"
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" \
            "$APP/Contents/Helpers/companion-native"
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" \
            --entitlements packaging/mac-app/entitlements-backend.plist \
            "$APP/Contents/Resources/agent-companion"
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ACTUAL_TEAM_ID="$(codesign -dv --verbose=4 "$APP" 2>&1 \
            | awk -F= '/^TeamIdentifier=/ { print $2; exit }')"
          test "$ACTUAL_TEAM_ID" = "$APPLE_TEAM_ID" || {
            echo "签名证书 Team ID 为 $ACTUAL_TEAM_ID，与 APPLE_TEAM_ID 不一致。" >&2
            exit 1
          }
          ditto -c -k --keepParent "$APP" "$NOTARY_ARCHIVE"
          xcrun notarytool submit "$NOTARY_ARCHIVE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

      - name: Package tarball and checksum
        working-directory: dist
        run: |
          COPYFILE_DISABLE=1 tar --no-xattrs -czf "${{ matrix.asset }}" "Agent Companion.app"
          if tar -tzf "${{ matrix.asset }}" | grep -q '\(^\|/\)\._'; then
            echo "归档里出现了 AppleDouble（._）文件" >&2
            exit 1
          fi
          shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256

      - name: Attach signed app to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.4.1
        with:
          files: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256

      - name: Delete temporary keychain
        if: always() && startsWith(github.ref, 'refs/tags/')
        run: |
          if test -n "${KEYCHAIN_PATH:-}" && test -f "$KEYCHAIN_PATH"; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP/agent-companion.p12"

  build-linux:
    name: Build Linux
    needs: [release]
    if: ${{ always() && (needs.release.result == 'success' || needs.release.result == 'skipped') && (!startsWith(github.ref, 'refs/tags/') || vars.BINARY_RELEASE == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          test "${GITHUB_REF_NAME#v}" = "$PACKAGE_VERSION" || {
            echo "tag $GITHUB_REF_NAME 与 package.json $PACKAGE_VERSION 不一致" >&2
            exit 1
          }

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Run tests
        run: npm test

      - name: Build binaries
        run: |
          node scripts/build-linux.mjs --target linux-x64 --out dist
          node scripts/build-linux.mjs --target linux-arm64 --out dist

      - name: Smoke test x64 binary
        run: |
          dist/linux-x64/agent-companion/agent-companion --help | grep -F "open-codex"
          dist/linux-x64/agent-companion/agent-companion cards list | node -e 'JSON.parse(require("fs").readFileSync(0, "utf8"))'

      # 固定属主与排序，归档内只有普通文件和目录，满足 install.sh 的条目校验。
      - name: Package tarballs and checksums
        working-directory: dist
        run: |
          for target in linux-x64 linux-arm64; do
            tar --sort=name --owner=0 --group=0 --numeric-owner \
              -czf "agent-companion-$target.tar.gz" -C "$target" agent-companion
            sha256sum "agent-companion-$target.tar.gz" > "agent-companion-$target.tar.gz.sha256"
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-companion-linux
          path: |
            dist/agent-companion-linux-*.tar.gz
            dist/agent-companion-linux-*.tar.gz.sha256

      - name: Attach Linux binaries to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.4.1
        with:
          files: |
            dist/agent-companion-linux-*.tar.gz
            dist/agent-companion-linux-*.tar.gz.sha256

  # 所有平台都构建成功后才发布 install.sh：脚本写入 Team ID、tag 与 Linux 归档的 SHA256。
  publish-installer:
    name: Publish installer
    if: startsWith(github.ref, 'refs/tags/') && vars.BINARY_RELEASE == 'true'
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Download Linux binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agent-companion-linux
          path: dist

      - name: Prepare pinned installer
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_TEAM_ID" || {
            echo "缺少 release secret: APPLE_TEAM_ID；拒绝发布未固定签名团队的安装脚本。" >&2
            exit 1
          }
          node scripts/prepare-installer.mjs --team-id "$APPLE_TEAM_ID" --tag "$GITHUB_REF_NAME" \
            --linux-x64 dist/agent-companion-linux-x64.tar.gz \
            --linux-arm64 dist/agent-companion-linux-arm64.tar.gz \
            --out dist/install.sh
          bash -n dist/install.sh
          shellcheck dist/install.sh
          grep -F "EXPECTED_TEAM_ID=\"$APPLE_TEAM_ID\"" dist/install.sh
          grep -F "RELEASE_TAG=\"$GITHUB_REF_NAME\"" dist/install.sh

      - name: Attach installer to release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.4.1
        with:
          files: dist/install.sh
